# 司法解释精选
# 来源：最高人民法院发布的相关司法解释
# 共收录高频引用司法解释条款 30+ 条

law_name: "最高人民法院司法解释（合同相关）"
source: "最高人民法院"
last_verified: "2026-08-07"

interpretations:
  - id: "JI-001"
    title: "买卖合同解释·瑕疵履行"
    source: "最高人民法院关于审理买卖合同纠纷案件适用法律问题的解释"
    text: "买卖合同对于付款期限作出的变更，不影响当事人关于逾期付款违约金的约定，但是不影响违约金的计算方法。"
    keywords: [买卖合同, 付款, 逾期, 违约金, 瑕疵履行]
    category: "买卖合同"
    frequency: high

  - id: "JI-002"
    title: "买卖合同解释·检验期间"
    source: "最高人民法院关于审理买卖合同纠纷案件适用法律问题的解释"
    text: "买受人在检验期限内未提出异议的，视为标的物符合约定。"
    keywords: [检验期限, 异议, 标的物, 符合约定]
    category: "买卖合同"
    frequency: high

  - id: "JI-003"
    title: "合同法解释二·违约金"
    source: "最高人民法院关于适用《中华人民共和国合同法》若干问题的解释（二）"
    text: "当事人约定的违约金超过造成损失的百分之三十的，一般可以认定为合同法第一百一十四条第二款规定的'过分高于造成的损失'。"
    keywords: [违约金, 损失, 三十, 过高]
    category: "合同法"
    frequency: critical
    note: "虽合同法已废止，但本规定精神已被民法典吸收，实务中仍参照适用"

  - id: "JI-004"
    title: "买卖合同解释·风险负担"
    source: "最高人民法院关于审理买卖合同纠纷案件适用法律问题的解释"
    text: "标的物毁损、灭失的风险在标的物交付之前由出卖人承担，交付之后由买受人承担。"
    keywords: [风险, 毁损, 灭失, 交付]
    category: "买卖合同"
    frequency: high

  - id: "JI-005"
    title: "民法典合同编通则解释·格式条款"
    source: "最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释"
    text: "提供格式条款的一方未履行提示或者说明义务，致使对方没有注意或者理解与其有重大利害关系的条款的，对方可以主张该条款不成为合同的内容。"
    keywords: [格式条款, 提示, 说明, 重大利害关系, 不成为合同内容]
    category: "民法典"
    frequency: critical

  - id: "JI-006"
    title: "民法典合同编通则解释·合同成立"
    source: "最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释"
    text: "当事人就合同主体、标的及其数量达成合意，合同即成立，但是法律另有规定或者当事人另有约定的除外。"
    keywords: [合同成立, 主体, 标的, 数量, 合意]
    category: "民法典"
    frequency: critical

  - id: "JI-007"
    title: "民法典合同编通则解释·合同无效"
    source: "最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释"
    text: "合同违反法律、行政法规的强制性规定的，人民法院应当认定合同无效，但是该强制性规定不导致合同无效的除外。"
    keywords: [合同无效, 强制性规定, 行政法规]
    category: "民法典"
    frequency: high

  - id: "JI-008"
    title: "民间借贷解释·利率上限"
    source: "最高人民法院关于审理民间借贷案件适用法律若干问题的规定"
    text: "出借人与借款人既约定了逾期利率，又约定了违约金或者其他费用，出借人可以选择主张逾期利息、违约金或者其他费用，也可以一并主张，但是总计超过合同成立时一年期贷款市场报价利率（LPR）四倍的部分，人民法院不予支持。"
    keywords: [民间借贷, 利率, 逾期利率, 违约金, LPR, 四倍]
    category: "借贷"
    frequency: critical

  - id: "JI-009"
    title: "民间借贷解释·利息扣除"
    source: "最高人民法院关于审理民间借贷案件适用法律若干问题的规定"
    text: "借据、收据、欠条等债权凭证载明的借款金额，一般认定为本金。预先在本金中扣除利息的，人民法院应当将实际出借的金额认定为本金。"
    keywords: [本金, 利息, 预先扣除, 欠条]
    category: "借贷"
    frequency: high

  - id: "JI-010"
    title: "建设工程施工合同解释·合同无效"
    source: "最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）"
    text: "建设工程施工合同具有下列情形之一的，应当依据民法典第一百五十三条第一款的规定，认定合同无效：（一）承包人未取得建筑业企业资质或者超越资质等级的；（二）没有资质的实际施工人借用有资质的建筑施工企业名义的；（三）建设工程必须进行招标而未招标或者中标无效的。"
    keywords: [建设工程, 合同无效, 资质, 招标, 中标]
    category: "建设工程"
    frequency: critical

  - id: "JI-011"
    title: "建设工程施工合同解释·价款结算"
    source: "最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）"
    text: "当事人就同一建设工程订立的数份建设工程施工合同均无效，但是建设工程质量合格，一方当事人请求参照实际履行的合同关于工程价款的约定折价补偿承包人的，人民法院应予支持。"
    keywords: [建设工程, 合同无效, 工程价款, 折价补偿, 质量合格]
    category: "建设工程"
    frequency: critical

  - id: "JI-012"
    title: "建设工程施工合同解释·优先受偿权"
    source: "最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）"
    text: "承包人享有的建设工程价款优先受偿权优于抵押权和其他债权。承包人应当在合理期限内行使建设工程价款优先受偿权，但最长不得超过十八个月，自发包人应当给付建设工程价款之日起算。"
    keywords: [优先受偿权, 抵押权, 十八个月, 工程价款]
    category: "建设工程"
    frequency: critical

  - id: "JI-013"
    title: "房屋租赁合同解释·买卖不破租赁"
    source: "最高人民法院关于审理城镇房屋租赁合同纠纷案件具体应用法律若干问题的解释"
    text: "租赁房屋在租赁期间发生所有权变动，承租人请求房屋受让人继续履行原租赁合同的，人民法院应予支持。"
    keywords: [买卖不破租赁, 所有权变动, 租赁合同]
    category: "租赁"
    frequency: high

  - id: "JI-014"
    title: "房屋租赁合同解释·转租"
    source: "最高人民法院关于审理城镇房屋租赁合同纠纷案件具体应用法律若干问题的解释"
    text: "承租人未经出租人同意转租的，出租人可以解除合同。"
    keywords: [转租, 出租人同意, 解除合同]
    category: "租赁"
    frequency: high

  - id: "JI-015"
    title: "劳动争议解释·解除合同"
    source: "最高人民法院关于审理劳动争议案件适用法律问题的解释（一）"
    text: "用人单位不支付工资、不为劳动者缴纳社会保险费等，劳动者可以解除劳动合同并要求用人单位支付经济补偿金。"
    keywords: [劳动合同, 工资, 社会保险, 经济补偿金, 解除]
    category: "劳动"
    frequency: high

  - id: "JI-016"
    title: "劳动争议解释·违约金"
    source: "最高人民法院关于审理劳动争议案件适用法律问题的解释（一）"
    text: "劳动合同中约定的违约金过高的，劳动者可以请求人民法院予以减少。"
    keywords: [劳动合同, 违约金, 过高, 减少]
    category: "劳动"
    frequency: high

  - id: "JI-017"
    title: "民法典总则解释·代理"
    source: "最高人民法院关于适用《中华人民共和国民法典》总则编若干问题的解释"
    text: "法定代表人、负责人超越权限订立的合同，除相对人知道或者应当知道其超越权限外，该代表行为有效，订立的合同对法人或者非法人组织发生效力。"
    keywords: [代表行为, 超越权限, 法定代表人, 效力]
    category: "总则"
    frequency: high

  - id: "JI-018"
    title: "民法典总则解释·欺诈"
    source: "最高人民法院关于适用《中华人民共和国民法典》总则编若干问题的解释"
    text: "故意告知虚假情况或者负有告知义务的人故意隐瞒真实情况，致使当事人基于错误认识作出意思表示的，人民法院可以认定为民法典第一百四十七条、第一百四十八条规定的欺诈。"
    keywords: [欺诈, 虚假情况, 隐瞒, 错误认识]
    category: "总则"
    frequency: high

  - id: "JI-019"
    title: "民法典总则解释·胁迫"
    source: "最高人民法院关于适用《中华人民共和国民法典》总则编若干问题的解释"
    text: "以给自然人或者其近亲属的人身、财产、名誉、荣誉、隐私、个人信息等造成损害或者以给法人、非法人组织的名誉、荣誉、财产等造成损害为要挟，迫使其基于恐惧心理作出意思表示的，人民法院可以认定为民法典第一百五十条规定的胁迫。"
    keywords: [胁迫, 要挟, 恐惧, 意思表示]
    category: "总则"
    frequency: medium

  - id: "JI-020"
    title: "民法典总则解释·重大误解"
    source: "最高人民法院关于适用《中华人民共和国民法典》总则编若干问题的解释"
    text: "行为人因对行为的性质、对方当事人、标的物的品种、质量、规格、数量、价格、履行期限、履行地点和方式、价款或者报酬等产生错误认识，按照通常理解如果不发生该错误认识行为人就不会作出相应意思表示的，人民法院可以认定为民法典第一百四十七条规定的重大误解。"
    keywords: [重大误解, 错误认识, 标的物, 质量, 价款]
    category: "总则"
    frequency: high

  - id: "JI-021"
    title: "民法典总则解释·显失公平"
    source: "最高人民法院关于适用《中华人民共和国民法典》总则编若干问题的解释"
    text: "一方利用对方处于危困状态、缺乏判断能力等情形，致使民事法律行为成立时显失公平的，受损害方有权请求人民法院或者仲裁机构予以撤销。"
    keywords: [显失公平, 危困, 缺乏判断能力, 撤销]
    category: "总则"
    frequency: high

  - id: "JI-022"
    title: "民法典物权解释·担保"
    source: "最高人民法院关于适用《中华人民共和国民法典》有关担保制度的解释"
    text: "担保合同是主债权债务合同的从合同。主债权债务合同无效的，担保合同无效，但是法律另有规定的除外。"
    keywords: [担保合同, 从合同, 主合同, 无效]
    category: "担保"
    frequency: critical

  - id: "JI-023"
    title: "民法典物权解释·保证期间"
    source: "最高人民法院关于适用《中华人民共和国民法典》有关担保制度的解释"
    text: "债权人未在保证期间内依法向保证人主张权利的，保证人在保证期间届满后不再承担保证责任。"
    keywords: [保证期间, 主张权利, 保证责任]
    category: "担保"
    frequency: high

  - id: "JI-024"
    title: "民法典物权解释·担保范围"
    source: "最高人民法院关于适用《中华人民共和国民法典》有关担保制度的解释"
    text: "担保的范围包括主债权及其利息、违约金、损害赔偿金、保管担保财产和实现担保物权的费用。"
    keywords: [担保范围, 利息, 违约金, 损害赔偿, 实现担保物权]
    category: "担保"
    frequency: high

  - id: "JI-025"
    title: "食品安全解释·惩罚性赔偿"
    source: "最高人民法院关于审理食品安全民事纠纷案件适用法律若干问题的解释"
    text: "生产不符合食品安全标准的食品，消费者可以要求生产者支付价款十倍或者损失三倍的赔偿金。"
    keywords: [食品安全, 惩罚性赔偿, 十倍, 三倍]
    category: "消费"
    frequency: high

  - id: "JI-026"
    title: "商品房买卖解释·合同解除"
    source: "最高人民法院关于审理商品房买卖合同纠纷案件适用法律若干问题的解释"
    text: "出卖人未取得商品房预售许可证明，与买受人订立的商品房预售合同，应当认定无效，但是在起诉前取得商品房预售许可证明的，可以认定有效。"
    keywords: [商品房, 预售许可, 合同无效]
    category: "房地产"
    frequency: high

  - id: "JI-027"
    title: "保险法解释·如实告知"
    source: "最高人民法院关于适用《中华人民共和国保险法》若干问题的解释"
    text: "投保人故意或者因重大过失未履行如实告知义务，足以影响保险人决定是否同意承保或者提高保险费率的，保险人有权解除合同。"
    keywords: [保险, 如实告知, 解除合同, 故意, 重大过失]
    category: "保险"
    frequency: high

  - id: "JI-028"
    title: "公司法解释·股东资格"
    source: "最高人民法院关于适用《中华人民共和国公司法》若干问题的规定"
    text: "当事人之间对股东资格发生争议时，应当结合公司章程、股东名册、出资证明、工商登记等因素综合判断。"
    keywords: [股东资格, 公司章程, 股东名册, 出资证明]
    category: "公司法"
    frequency: high

  - id: "JI-029"
    title: "公司法解释·股权转让"
    source: "最高人民法院关于适用《中华人民共和国公司法》若干问题的规定"
    text: "有限责任公司的股东向股东以外的人转让股权，其他股东主张优先购买权的，人民法院应当予以支持。"
    keywords: [股权转让, 优先购买权, 股东]
    category: "公司法"
    frequency: high

  - id: "JI-030"
    title: "公司法解释·股东代表诉讼"
    source: "最高人民法院关于适用《中华人民共和国公司法》若干问题的规定"
    text: "股东依据公司法第一百五十一条提起代表诉讼，应当符合规定的持股比例和持股期限要求。"
    keywords: [股东代表诉讼, 持股比例, 持股期限]
    category: "公司法"
    frequency: high

  - id: "JI-031"
    title: "电子签名法解释·效力"
    source: "电子签名法相关司法解释"
    text: "可靠的电子签名与手写签名或者盖章具有同等的法律效力。"
    keywords: [电子签名, 法律效力, 手写签名]
    category: "电子签名"
    frequency: high
