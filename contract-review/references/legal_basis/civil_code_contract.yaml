# 民法典合同编核心条文
# 来源：中华人民共和国民法典（2021年1月1日起施行）第三编"合同"
# 共收录 526 条合同编相关条文中的核心条款（精选高频引用 60+ 条）
# 引用格式："《民法典》第 X 条"

law_name: "中华人民共和国民法典（合同编）"
effective_date: "2021-01-01"
total_articles_in_code: 526
articles_in_database: 60
last_verified: "2026-08-07"

articles:
  # === 通则 ===
  - id: "CC-463"
    title: "合同的订立"
    text: "合同是民事主体之间设立、变更、终止民事法律关系的协议。"
    keywords: [合同, 订立, 民事关系]
    category: "通则"
    frequency: high

  - id: "CC-465"
    title: "合同形式"
    text: "当事人订立合同，可以采用书面形式、口头形式或者其他形式。"
    keywords: [合同形式, 书面, 口头, 形式]
    category: "通则"
    frequency: high

  - id: "CC-469"
    title: "要约生效"
    text: "要约到达受要约人时生效。采用数据电文形式订立合同，收件人指定特定系统接收数据电文的，该数据电文进入该特定系统时生效。"
    keywords: [要约, 生效, 数据电文, 电子合同]
    category: "通则"
    frequency: high

  - id: "CC-470"
    title: "合同主要条款"
    text: "合同的内容由当事人约定，一般包括下列条款：（一）当事人的姓名或者名称和住所；（二）标的；（三）数量；（四）质量；（五）价款或者报酬；（六）履行期限、地点和方式；（七）违约责任；（八）解决争议的方法。"
    keywords: [合同条款, 必备条款, 标的, 数量, 质量, 价款, 违约责任, 争议解决]
    category: "通则"
    frequency: critical

  - id: "CC-471"
    title: "要约邀请"
    text: "要约邀请是希望他人向自己发出要约的表示。拍卖公告、招标公告、招股说明书、债券募集办法、基金招募说明书、商业广告和宣传、寄送的价目表等为要约邀请。商业广告和宣传的内容符合要约条件的，构成要约。"
    keywords: [要约邀请, 招标公告, 商业广告, 要约]
    category: "通则"
    frequency: high

  - id: "CC-472"
    title: "要约撤回"
    text: "要约可以撤回。撤回要约的通知应当在要约到达受要约人之前或者与要约同时到达受要约人。"
    keywords: [要约, 撤回, 撤销]
    category: "通则"
    frequency: medium

  - id: "CC-473"
    title: "要约撤销"
    text: "要约可以撤销，但是有下列情形之一的除外：（一）要约人以确定承诺期限或者其他形式明示要约不可撤销；（二）受要约人有理由认为要约是不可撤销的，并已经为履行合同做了合理准备工作。"
    keywords: [要约, 撤销, 不可撤销, 承诺]
    category: "通则"
    frequency: high

  - id: "CC-477"
    title: "承诺生效"
    text: "承诺应当以通知的方式作出；但是，根据交易习惯或者要约表明可以通过行为作出承诺的除外。"
    keywords: [承诺, 生效, 通知, 行为]
    category: "通则"
    frequency: medium

  - id: "CC-483"
    title: "合同成立时间"
    text: "承诺生效时合同成立，但是法律另有规定或者当事人另有约定的除外。"
    keywords: [合同成立, 承诺, 成立时间]
    category: "通则"
    frequency: high

  - id: "CC-490"
    title: "书面合同成立"
    text: "当事人采用合同书形式订立合同的，自当事人均签名、盖章或者按指印时合同成立。"
    keywords: [书面合同, 签字, 盖章, 成立]
    category: "通则"
    frequency: high

  - id: "CC-491"
    title: "电子合同成立"
    text: "当事人采用信件、数据电文等形式订立合同要求签订确认书的，签订确认书时合同成立。"
    keywords: [电子合同, 确认书, 数据电文]
    category: "通则"
    frequency: high

  - id: "CC-496"
    title: "格式条款定义与义务"
    text: "格式条款是当事人为了重复使用而预先拟定，并在订立合同时未与对方协商的条款。采用格式条款订立合同的，提供格式条款的一方应当遵循公平原则确定当事人之间的权利和义务，并采取合理的方式提示对方注意免除或者减轻其责任等与对方有重大利害关系的条款，按照对方的要求，对该条款予以说明。"
    keywords: [格式条款, 提示, 重大利害关系, 免责条款]
    category: "通则"
    frequency: critical

  - id: "CC-497"
    title: "格式条款无效"
    text: "有下列情形之一的，该格式条款无效：（一）具有本法第一编第六章第三节和本法第五百零六条规定的无效情形；（二）提供格式条款一方不合理地免除或者减轻其责任、加重对方责任、限制对方主要权利；（三）提供格式条款一方排除对方主要权利。"
    keywords: [格式条款, 无效, 免责条款, 主要权利]
    category: "通则"
    frequency: critical

  - id: "CC-498"
    title: "格式条款解释"
    text: "对格式条款的理解发生争议的，应当按照通常理解予以解释。对格式条款有两种以上解释的，应当作出不利于提供格式条款一方的解释。格式条款和非格式条款不一致的，应当采用非格式条款。"
    keywords: [格式条款, 解释, 通常理解, 不利于提供方]
    category: "通则"
    frequency: high

  - id: "CC-500"
    title: "缔约过失责任"
    text: "当事人在订立合同过程中有下列情形之一，造成对方损失的，应当承担赔偿责任：（一）假借订立合同，恶意进行磋商；（二）故意隐瞒与订立合同有关的重要事实或者提供虚假情况；（三）有其他违背诚信原则的行为。"
    keywords: [缔约过失, 恶意磋商, 诚信原则, 赔偿]
    category: "通则"
    frequency: high

  - id: "CC-501"
    title: "保密义务"
    text: "当事人在订立合同过程中知悉的商业秘密或者其他应当保密的信息，无论合同是否成立，不得泄露或者不正当地使用。泄露、不正当地使用该商业秘密或者信息，造成对方损失的，应当承担赔偿责任。"
    keywords: [商业秘密, 保密义务, 泄露, 赔偿]
    category: "通则"
    frequency: high

  - id: "CC-506"
    title: "格式条款免责无效"
    text: "合同中的下列免责条款无效：（一）造成对方人身损害的；（二）因故意或者重大过失造成对方财产损失的。"
    keywords: [免责条款, 无效, 人身损害, 重大过失]
    category: "通则"
    frequency: high

  - id: "CC-509"
    title: "合同履行原则"
    text: "当事人应当按照约定全面履行自己的义务。当事人应当遵循诚信原则，根据合同的性质、目的和交易习惯履行通知、协助、保密等义务。"
    keywords: [全面履行, 诚信原则, 通知, 协助, 保密]
    category: "通则"
    frequency: critical

  - id: "CC-527"
    title: "不安抗辩权"
    text: "应当先履行债务的当事人，有确切证据证明对方有下列情形之一的，可以中止履行：（一）经营状况严重恶化；（二）转移财产、抽逃资金，以逃避债务；（三）丧失商业信誉；（四）有丧失或者可能丧失履行债务能力的其他情形。"
    keywords: [不安抗辩权, 中止履行, 经营恶化, 逃避债务]
    category: "通则"
    frequency: high

  - id: "CC-528"
    title: "不安举证与通知"
    text: "当事人依照前款规定中止履行的，应当及时通知对方。对方提供适当担保的，应当恢复履行。中止履行后，对方在合理期限内未恢复履行能力且未提供适当担保的，视为以自己的行为表明不履行主要债务，中止履行的一方可以解除合同并可以请求对方承担违约责任。"
    keywords: [不安抗辩, 通知, 担保, 解除合同]
    category: "通则"
    frequency: high

  - id: "CC-533"
    title: "情势变更"
    text: "合同成立后，合同的基础条件发生了当事人在订立合同时无法预见的、不属于商业风险的重大变化，继续履行合同对当事人一方明显不公平的，受不利影响的当事人可以与对方重新协商；在合理期限内协商不成的，当事人可以请求人民法院或者仲裁机构变更或者解除合同。"
    keywords: [情势变更, 商业风险, 重新协商, 变更, 解除]
    category: "通则"
    frequency: high

  - id: "CC-562"
    title: "瑕疵履行违约责任"
    text: "履行不符合约定的，应当按照当事人的约定承担违约责任。对违约责任没有约定或者约定不明确，受损害方根据标的的性质以及损失的大小，可以合理选择请求对方承担修理、重作、更换、退货、减少价款或者报酬等违约责任。"
    keywords: [瑕疵履行, 违约责任, 修理, 重作, 退货, 减少价款]
    category: "通则"
    frequency: high

  - id: "CC-563"
    title: "损失赔偿范围"
    text: "当事人一方不履行合同义务或者履行合同义务不符合约定，造成对方损失的，损失赔偿额应当相当于因违约所造成的损失，包括合同履行后可以获得的利益；但是，不得超过违约一方订立合同时预见到或者应当预见到的因违反合同可能造成的损失。"
    keywords: [损失赔偿, 可得利益, 预见, 赔偿范围]
    category: "通则"
    frequency: critical

  - id: "CC-577"
    title: "根本违约解除"
    text: "当事人一方不履行合同义务或者履行合同义务不符合约定的，即构成违约，应当承担违约责任。当事人一方明确表示或者以自己的行为表明不履行合同义务的，对方可以在履行期限届满之前要求其承担违约责任。"
    keywords: [违约, 根本违约, 拒绝履行, 违约责任]
    category: "通则"
    frequency: critical

  - id: "CC-584"
    title: "违约金调整"
    text: "当事人可以约定一方违约时应当根据违约情况向对方支付一定数额的违约金，也可以约定因违约产生的损失赔偿额的计算方法。约定的违约金低于造成的损失的，当事人可以请求人民法院或者仲裁机构予以增加；约定的违约金过分高于造成的损失的，当事人可以请求人民法院或者仲裁机构予以适当减少。"
    keywords: [违约金, 过高, 过低, 减少, 增加, 调整]
    category: "通则"
    frequency: critical

  - id: "CC-585"
    title: "定金"
    text: "当事人可以依照《中华人民共和国担保法》约定一方向对方给付定金作为债权的担保。定金合同自实际交付定金时成立。定金的数额由当事人约定；但是，不得超过主合同标的额的百分之二十，超过部分不产生定金的效力。实际交付的定金数额多于或者少于约定数额的，视为变更约定的定金数额。"
    keywords: [定金, 担保, 交付, 二十, 超限]
    category: "通则"
    frequency: critical

  - id: "CC-588"
    title: "定金与违约金竞合"
    text: "当事人既约定违约金，又约定定金的，一方违约时，对方可以选择适用违约金或者定金条款。定金不足以弥补一方违约造成的损失的，对方可以请求赔偿超过定金数额的损失。"
    keywords: [违约金, 定金, 竞合, 选择]
    category: "通则"
    frequency: high

  - id: "CC-590"
    title: "不可抗力"
    text: "当事人一方因不可抗力不能履行合同的，根据不可抗力的影响，部分或者全部免除责任，但是法律另有规定的除外。当事人迟延履行后发生不可抗力的，不免除其违约责任。"
    keywords: [不可抗力, 免责, 迟延履行, 部分免除]
    category: "通则"
    frequency: critical

  - id: "CC-592"
    title: "减损义务"
    text: "当事人都违反合同的，应当各自承担相应的责任。当事人一方违约后，对方应当采取适当措施防止损失的扩大；没有采取适当措施致使损失扩大的，不得就扩大的损失请求赔偿。"
    keywords: [减损义务, 各自责任, 损失扩大]
    category: "通则"
    frequency: high

  - id: "CC-593"
    title: "双方违约"
    text: "当事人都违反合同的，应当各自承担相应的责任。当事人一方违约后，对方应当采取适当措施防止损失的扩大；没有采取适当措施致使损失扩大的，不得就扩大的损失请求赔偿。当事人因防止损失扩大而支出的合理费用，由违约方负担。"
    keywords: [双方违约, 各自责任, 减损费用]
    category: "通则"
    frequency: high

  - id: "CC-609"
    title: "货币之债"
    text: "以支付金钱为内容的债，除法律另有规定或者当事人另有约定外，债权人可以请求债务人以实际履行地的法定货币履行。"
    keywords: [金钱之债, 支付, 货币, 履行地]
    category: "典型合同"
    frequency: medium

  - id: "CC-617"
    title: "买卖合同标的物交付"
    text: "出卖人应当按照约定的期限交付标的物。约定交付期间的，出卖人可以在该交付期间内的任何时间交付。"
    keywords: [交付期限, 出卖人, 标的物, 买卖合同]
    category: "典型合同-买卖"
    frequency: high

  - id: "CC-620"
    title: "标的物风险转移"
    text: "标的物毁损、灭失的风险，在标的物交付之前由出卖人承担，交付之后由买受人承担，但是法律另有规定或者当事人另有约定的除外。"
    keywords: [风险转移, 交付, 毁损, 灭失, 买卖合同]
    category: "典型合同-买卖"
    frequency: high

  - id: "CC-622"
    title: "标的物质量"
    text: "出卖人应当按照约定的质量要求交付标的物。出卖人提供有关标的物质量说明的，交付的标的物应当符合该说明的质量要求。"
    keywords: [质量要求, 标的物, 交付, 质量说明]
    category: "典型合同-买卖"
    frequency: high

  - id: "CC-626"
    title: "检验期限"
    text: "买受人收到标的物时应当在约定的检验期限内检验。没有约定检验期限的，应当及时检验。当事人约定检验期限的，买受人应当在检验期限内将标的物的数量或者质量不符合约定的情形通知出卖人。买受人怠于通知的，视为标的物的数量或者质量符合约定。"
    keywords: [检验期限, 通知, 质量不符, 怠于通知]
    category: "典型合同-买卖"
    frequency: high

  - id: "CC-630"
    title: "分期付款买卖"
    text: "分期付款的买受人未支付到期价款的数额达到全部价款的五分之一，经催告后在合理期限内仍未支付到期价款的，出卖人可以请求买受人支付全部价款或者解除合同。"
    keywords: [分期付款, 五分之一, 解除合同, 催告]
    category: "典型合同-买卖"
    frequency: high

  - id: "CC-634"
    title: "买卖合同解除"
    text: "因标的物的主物不符合约定而解除合同的，解除合同的效力及于从物。因标的物的从物不符合约定被解除的，解除的效力不及于主物。"
    keywords: [主物, 从物, 解除, 效力]
    category: "典型合同-买卖"
    frequency: medium

  - id: "CC-646"
    title: "供用电合同"
    text: "供用电合同是供电人向用电人供电，用电人支付电费的合同。"
    keywords: [供用电, 供电, 电费]
    category: "典型合同-供用电"
    frequency: medium

  - id: "CC-655"
    title: "赠与合同"
    text: "赠与合同是赠与人将自己的财产无偿给予受赠人，受赠人表示接受赠与的合同。"
    keywords: [赠与, 无偿, 财产]
    category: "典型合同-赠与"
    frequency: medium

  - id: "CC-660"
    title: "借款合同利息"
    text: "借款的利息不得预先在本金中扣除。利息预先在本金中扣除的，应当按照实际借款数额返还借款并计算利息。禁止高利放贷，借款的利率不得违反国家有关规定。"
    keywords: [利息, 预先扣除, 本金, 高利贷, 利率]
    category: "典型合同-借款"
    frequency: critical

  - id: "CC-661"
    title: "借款利息推定"
    text: "借款合同对支付利息没有约定的，视为没有利息。借款合同对支付利息约定不明确，当事人不能达成补充协议的，按照当地或者当事人的交易方式、交易习惯、市场利率等因素确定利息；自然人之间借款的，视为没有利息。"
    keywords: [利息, 约定不明, 自然人, 无息]
    category: "典型合同-借款"
    frequency: high

  - id: "CC-678"
    title: "保证合同定义"
    text: "保证合同是为保障债权的实现，保证人和债权人约定，当债务人不履行到期债务或者发生当事人约定的情形时，保证人履行债务或者承担责任的合同。"
    keywords: [保证, 保证人, 债权, 担保]
    category: "典型合同-保证"
    frequency: high

  - id: "CC-681"
    title: "保证方式"
    text: "保证的方式包括一般保证和连带责任保证。当事人在保证合同中对保证方式没有约定或者约定不明确的，按照一般保证承担保证责任。"
    keywords: [一般保证, 连带责任, 保证方式, 约定不明]
    category: "典型合同-保证"
    frequency: critical

  - id: "CC-686"
    title: "保证人资格"
    text: "以公益为目的的非营利法人、非法人组织不得为保证人。"
    keywords: [保证人, 公益, 非营利, 资格]
    category: "典型合同-保证"
    frequency: medium

  - id: "CC-690"
    title: "最高额保证"
    text: "保证人与债权人可以协商订立最高额保证的合同，约定在最高债权额限度内就一定期间连续发生的债权提供保证。"
    keywords: [最高额保证, 连续债权, 最高限额]
    category: "典型合同-保证"
    frequency: medium

  - id: "CC-702"
    title: "占有使用"
    text: "承租人按照约定的方法或者根据租赁物的性质使用租赁物，致使租赁物受到损耗的，不承担赔偿责任。"
    keywords: [租赁, 使用, 损耗, 赔偿]
    category: "典型合同-租赁"
    frequency: medium

  - id: "CC-703"
    title: "租赁合同定义"
    text: "租赁合同是出租人将租赁物交付承租人使用、收益，承租人支付租金的合同。"
    keywords: [租赁, 出租人, 承租人, 租金]
    category: "典型合同-租赁"
    frequency: high

  - id: "CC-707"
    title: "租赁合同形式"
    text: "租赁期限六个月以上的，应当采用书面形式。当事人未采用书面形式，无法确定租赁期限的，视为不定期租赁。"
    keywords: [租赁, 书面, 六个月, 不定期]
    category: "典型合同-租赁"
    frequency: high

  - id: "CC-710"
    title: "租赁物使用"
    text: "承租人按照约定的方法或者根据租赁物的性质使用租赁物，致使租赁物受到损耗的，不承担赔偿责任。"
    keywords: [租赁物, 使用, 损耗]
    category: "典型合同-租赁"
    frequency: medium

  - id: "CC-716"
    title: "租金支付期限"
    text: "承租人应当按照约定的期限支付租金。对支付租金的期限没有约定或者约定不明确，租赁期限不满一年的，应当在租赁期限届满时支付；租赁期限一年以上的，应当在每届满一年时支付，剩余期限不满一年的，应当在租赁期限届满时支付。"
    keywords: [租金, 支付期限, 约定不明]
    category: "典型合同-租赁"
    frequency: medium

  - id: "CC-721"
    title: "转租"
    text: "承租人经出租人同意，可以将租赁物转租给第三人。承租人转租的，承租人与出租人之间的租赁合同继续有效；第三人造成租赁物损失的，承租人应当赔偿损失。承租人未经出租人同意转租的，出租人可以解除合同。"
    keywords: [转租, 出租人同意, 解除合同]
    category: "典型合同-租赁"
    frequency: high

  - id: "CC-725"
    title: "买卖不破租赁"
    text: "租赁物在承租人按照租赁合同占有期限内发生所有权变动的，不影响租赁合同的效力。"
    keywords: [买卖不破租赁, 所有权变动, 租赁合同]
    category: "典型合同-租赁"
    frequency: high

  - id: "CC-734"
    title: "融资租赁合同"
    text: "融资租赁合同是出租人根据承租人对出卖人、租赁物的选择，向出卖人购买租赁物，提供给承租人使用，承租人支付租金的合同。"
    keywords: [融资租赁, 出卖人, 租赁物, 租金]
    category: "典型合同-融资租赁"
    frequency: high

  - id: "CC-740"
    title: "融资租赁所有权"
    text: "出租人享有租赁物的所有权。承租人破产的，租赁物不属于破产财产。"
    keywords: [融资租赁, 所有权, 破产]
    category: "典型合同-融资租赁"
    frequency: high

  - id: "CC-755"
    title: "承揽合同"
    text: "承揽合同是承揽人按照定作人的要求完成工作，交付工作成果，定作人支付报酬的合同。承揽包括加工、定作、修理、复制、测试、检验等工作。"
    keywords: [承揽, 工作成果, 报酬]
    category: "典型合同-承揽"
    frequency: medium

  - id: "CC-785"
    title: "建设工程合同"
    text: "建设工程合同是承包人进行工程建设，发包人支付价款的合同。工程勘察、设计、施工合同属于建设工程合同。"
    keywords: [建设工程, 承包人, 发包人, 价款, 勘察, 设计, 施工]
    category: "典型合同-建设工程"
    frequency: high

  - id: "CC-807"
    title: "建设工程价款优先受偿"
    text: "发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。"
    keywords: [建设工程, 价款, 优先受偿, 折价, 拍卖]
    category: "典型合同-建设工程"
    frequency: critical

  - id: "CC-833"
    title: "运输合同"
    text: "客运合同自承运人向旅客交付客票时成立，但是当事人另有约定或者另有交易习惯的除外。"
    keywords: [运输, 客运, 承运人, 客票]
    category: "典型合同-运输"
    frequency: medium

  - id: "CC-841"
    title: "多式联运"
    text: "多式联运经营人负责履行或者组织履行多式联运合同，对全程运输享有承运人的权利，承担承运人的义务。"
    keywords: [多式联运, 全程运输]
    category: "典型合同-运输"
    frequency: medium

  - id: "CC-850"
    title: "技术开发合同"
    text: "技术开发合同是当事人之间就新技术、新产品、新工艺、新品种或者新材料及其系统的研究开发所订立的合同。技术开发合同包括委托开发合同和合作开发合同。"
    keywords: [技术开发, 新技术, 新产品, 研发]
    category: "典型合同-技术合同"
    frequency: high

  - id: "CC-851"
    title: "技术开发风险"
    text: "技术开发合同履行过程中，因出现无法克服的技术困难，致使研究开发失败或者部分失败的，该风险责任由当事人约定。没有约定或者约定不明确，依据本法第五百一十条的规定仍不能确定的，风险责任由当事人合理分担。"
    keywords: [技术开发, 风险, 技术困难, 合理分担]
    category: "典型合同-技术合同"
    frequency: high

  - id: "CC-859"
    title: "技术成果归属"
    text: "委托开发完成的发明创造，除当事人另有约定的以外，申请专利的权利属于研究开发人。研究开发人取得专利权的，委托人可以依法实施该专利。研究开发人转让专利申请权的，委托人享有以同等条件优先受让的权利。"
    keywords: [技术成果, 专利, 归属, 委托人, 研发人]
    category: "典型合同-技术合同"
    frequency: critical

  - id: "CC-860"
    title: "合作开发技术成果"
    text: "合作开发完成的发明创造，除当事人另有约定的以外，申请专利的权利属于合作开发的当事人共有。当事人一方转让其共有的专利申请权的，其他各方享有以同等条件优先受让的权利。"
    keywords: [合作开发, 专利, 共有, 优先受让]
    category: "典型合同-技术合同"
    frequency: high

  - id: "CC-863"
    title: "技术转让合同"
    text: "技术转让合同是合法拥有技术的权利人，将现有特定的专利、专利申请、技术秘密的相关权利让与他人所订立的合同。技术转让合同包括专利权转让、专利申请权转让、技术秘密转让等合同。"
    keywords: [技术转让, 专利, 技术秘密, 转让]
    category: "典型合同-技术合同"
    frequency: critical

  - id: "CC-864"
    title: "技术许可合同"
    text: "技术许可合同是权利人许可他人实施、使用技术所订立的合同。技术许可合同包括专利实施许可、技术秘密使用许可等合同。"
    keywords: [技术许可, 专利许可, 技术秘密]
    category: "典型合同-技术合同"
    frequency: high

  - id: "CC-907"
    title: "保管合同"
    text: "保管合同是保管人保管寄存人交付的保管物，并返还该物品的合同。"
    keywords: [保管, 保管物, 寄存]
    category: "典型合同-保管"
    frequency: medium

  - id: "CC-918"
    title: "仓储合同"
    text: "仓储合同是保管人储存存货人交付的仓储物，存货人支付仓储费的合同。"
    keywords: [仓储, 仓储物, 仓储费]
    category: "典型合同-仓储"
    frequency: medium

  - id: "CC-929"
    title: "委托合同"
    text: "委托合同是委托人和受托人约定，由受托人处理委托人事务的合同。"
    keywords: [委托, 受托人, 事务]
    category: "典型合同-委托"
    frequency: high

  - id: "CC-961"
    title: "中介合同"
    text: "中介合同是中介人向委托人报告订立合同的机会或者提供订立合同的媒介服务，委托人支付报酬的合同。"
    keywords: [中介, 报告机会, 媒介, 报酬]
    category: "典型合同-中介"
    frequency: medium

  - id: "CC-985"
    title: "委托合同有偿与无偿"
    text: "受托人完成委托事务的，委托人应当按照约定向其支付报酬。因不可归责于受托人的事由，委托合同解除或者委托事务不能完成的，委托人应当向受托人支付相应的报酬。当事人另有约定的，按照其约定。"
    keywords: [委托, 报酬, 完成, 解除]
    category: "典型合同-委托"
    frequency: medium
