# 公司法核心条文
# 来源：中华人民共和国公司法（2023年12月29日修订，2024年7月1日起施行）
# 共收录高频引用条款 40+ 条

law_name: "中华人民共和国公司法"
effective_date: "2024-07-01"
total_articles_in_code: 266
articles_in_database: 40
last_verified: "2026-08-07"

articles:
  - id: "CL-2"
    title: "公司设立"
    text: "本法所称公司，是指依照本法在中华人民共和国境内设立的有限责任公司和股份有限公司。"
    keywords: [公司, 设立, 有限责任公司, 股份有限公司]
    category: "总则"
    frequency: high

  - id: "CL-11"
    title: "公司章程"
    text: "设立公司应当依法制定公司章程。公司章程对公司、股东、董事、监事、高级管理人员具有约束力。"
    keywords: [公司章程, 约束力, 股东, 董事, 高级管理人员]
    category: "总则"
    frequency: critical

  - id: "CL-12"
    title: "经营范围"
    text: "公司的经营范围由公司章程规定，并依法登记。公司可以修改公司章程，改变经营范围，但是应当办理变更登记。"
    keywords: [经营范围, 公司章程, 变更登记]
    category: "总则"
    frequency: medium

  - id: "CL-21"
    title: "公司名称"
    text: "公司只能使用一个公司名称，且应当符合国家有关规定。"
    keywords: [公司名称, 唯一性]
    category: "总则"
    frequency: medium

  - id: "CL-32"
    title: "法定代表人"
    text: "公司法定代表人依照公司章程的规定，由董事长、执行董事或者经理担任，并依法登记。公司法定代表人变更的，应当办理变更登记。"
    keywords: [法定代表人, 董事长, 执行董事, 经理, 变更登记]
    category: "总则"
    frequency: high

  - id: "CL-46"
    title: "有限责任"
    text: "有限责任公司的股东以其认缴的出资额为限对公司承担责任；股份有限公司的股东以其认购的股份为限对公司承担责任。"
    keywords: [有限责任, 股东, 出资额, 责任]
    category: "总则"
    frequency: high

  - id: "CL-47"
    title: "股东权利"
    text: "公司股东有权查阅、复制公司章程、股东名册、股东会会议记录、董事会会议决议、监事会会议决议和财务会计报告。"
    keywords: [股东权利, 查阅, 复制, 知情权]
    category: "总则"
    frequency: high

  - id: "CL-52"
    title: "股东会职权"
    text: "股东会行使下列职权：（一）审议批准董事会、监事会或者监事的报告；（二）审议批准公司的利润分配方案和弥补亏损方案；（三）对公司增加或者减少注册资本作出决议；（四）对公司合并、分立、解散、清算或者变更公司形式作出决议；（五）修改公司章程；（六）公司章程规定的其他职权。"
    keywords: [股东会, 职权, 利润分配, 合并, 分立, 解散, 章程修改]
    category: "组织机构"
    frequency: critical

  - id: "CL-66"
    title: "董事会职权"
    text: "董事会行使下列职权：（一）召集股东会会议，并向股东会报告工作；（二）执行股东会的决议；（三）决定公司的经营计划和投资方案；（四）制订公司的年度财务预算方案、决算方案；（五）制订公司的利润分配方案和弥补亏损方案；（六）制订公司增加或者减少注册资本以及发行公司债券的方案；（七）制订公司合并、分立、解散或者变更公司形式的方案；（八）决定公司内部管理机构的设置；（九）决定聘任或者解聘公司经理及其报酬事项，并根据经理的提名决定聘任或者解聘公司副经理、财务负责人及其报酬事项；（十）制定公司的基本管理制度；（十一）公司章程规定的其他职权。"
    keywords: [董事会, 职权, 经营计划, 投资, 财务预算, 利润分配]
    category: "组织机构"
    frequency: critical

  - id: "CL-74"
    title: "经理职权"
    text: "有限责任公司由经理行使下列职权：（一）主持公司的生产经营管理工作，组织实施董事会决议；（二）组织实施公司年度经营计划和投资方案；（三）拟订公司内部管理机构设置方案；（四）拟订公司的基本管理制度；（五）制定公司的具体规章；（六）提请聘任或者解聘公司副经理、财务负责人；（七）决定聘任或者解聘除应由董事会决定聘任或者解聘以外的负责管理人员；（八）董事会授予的其他职权。"
    keywords: [经理, 职权, 生产经营, 管理制度]
    category: "组织机构"
    frequency: high

  - id: "CL-81"
    title: "监事会职权"
    text: "监事会行使下列职权：（一）检查公司财务；（二）对董事、高级管理人员执行职务的行为进行监督，对违反法律、行政法规、公司章程或者股东会决议的董事、高级管理人员提出罢免的建议；（三）当董事、高级管理人员的行为损害公司的利益时，要求董事、高级管理人员予以纠正；（四）依照本法第一百八十八条的规定，对董事、高级管理人员提起诉讼；（五）公司章程规定的其他职权。"
    keywords: [监事会, 职权, 监督, 检查, 诉讼]
    category: "组织机构"
    frequency: high

  - id: "CL-96"
    title: "股权转让"
    text: "有限责任公司的股东之间可以相互转让其全部或者部分股权。股东向股东以外的人转让股权，应当将股权转让的数量、价格、支付方式和期限等事项书面通知其他股东，其他股东在同等条件下享有优先购买权。"
    keywords: [股权转让, 优先购买权, 通知, 同等条件]
    category: "有限责任公司的股权转让"
    frequency: critical

  - id: "CL-97"
    title: "股权转让程序"
    text: "股东就股权转让书面通知其他股东后，其他股东自接到书面通知之日起三十日内未答复的，视为放弃优先购买权。"
    keywords: [股权转让, 三十日, 优先购买权]
    category: "有限责任公司的股权转让"
    frequency: high

  - id: "CL-138"
    title: "股份公司设立方式"
    text: "股份有限公司的设立，可以采取发起设立或者募集设立的方式。"
    keywords: [设立, 发起设立, 募集设立]
    category: "股份有限公司的设立"
    frequency: medium

  - id: "CL-152"
    title: "股份公司股份转让"
    text: "股东转让其股份，应当在依法设立的证券交易场所进行，或者按照国务院规定的其他方式进行。"
    keywords: [股份转让, 证券交易场所]
    category: "股份有限公司的股份发行和转让"
    frequency: high

  - id: "CL-180"
    title: "董事忠实义务"
    text: "董事、监事、高级管理人员应当遵守法律、行政法规和公司章程，对公司负有忠实义务和勤勉义务。"
    keywords: [董事, 监事, 高级管理人员, 忠实义务, 勤勉义务]
    category: "公司董事、监事、高级管理人员的资格和义务"
    frequency: critical

  - id: "CL-181"
    title: "禁止行为"
    text: "董事、监事、高级管理人员不得利用职权收受贿赂或者其他非法收入，不得侵占公司的财产，不得有下列行为：（一）挪用公司资金；（二）将公司资金以其个人名义或者以其他个人名义开立账户存储；（三）违反公司章程的规定，未经股东会、董事会同意，将公司资金借贷给他人或者以公司财产为他人提供担保；（四）违反公司章程的规定或者未经股东会、董事会同意，与本公司订立合同或者进行交易；（五）接受他人与公司交易的佣金归为己有；（六）擅自披露公司秘密；（七）违反对公司忠实义务的其他行为。"
    keywords: [禁止行为, 挪用资金, 佣金, 公司秘密, 忠实义务]
    category: "公司董事、监事、高级管理人员的资格和义务"
    frequency: critical

  - id: "CL-184"
    title: "赔偿责任"
    text: "董事、监事、高级管理人员执行职务违反法律、行政法规或者公司章程的规定，给公司造成损失的，应当承担赔偿责任。"
    keywords: [董事, 监事, 高级管理人员, 赔偿责任, 损失]
    category: "公司董事、监事、高级管理人员的资格和义务"
    frequency: critical

  - id: "CL-188"
    title: "股东代表诉讼"
    text: "监事会、不设监事会的有限责任公司的监事，或者董事会、执行董事收到前款规定的股东书面请求后拒绝提起诉讼，或者自收到请求之日起三十日内未提起诉讼，或者情况紧急、不立即提起诉讼将会使公司利益受到难以弥补的损失的，前款规定的股东有权为了公司的利益以自己的名义直接向人民法院提起诉讼。"
    keywords: [股东, 诉讼, 代表诉讼, 监事会, 董事会]
    category: "公司董事、监事、高级管理人员的资格和义务"
    frequency: high

  - id: "CL-216"
    title: "公司担保"
    text: "公司向其他企业投资或者为他人提供担保，依照公司章程的规定，由董事会或者股东会决议；公司章程对投资或者担保的总额及单项投资或者担保的数额有限额规定的，不得超过规定的限额。"
    keywords: [担保, 投资, 决议, 限额]
    category: "公司财务、会计"
    frequency: high

  - id: "CL-221"
    title: "违法分配利润"
    text: "公司违反本法规定在弥补亏损和提取法定公积金之前向股东分配利润的，股东必须将违反规定分配的利润退还公司。"
    keywords: [利润分配, 法定公积金, 退还]
    category: "公司财务、会计"
    frequency: high

  - id: "CL-226"
    title: "利润分配"
    text: "有限责任公司按照股东实缴的出资比例分配利润，全体股东约定不按照出资比例分配利润的除外；股份有限公司按照股东所持有的股份比例分配利润，公司章程另有规定的除外。"
    keywords: [利润分配, 出资比例, 股份比例]
    category: "公司财务、会计"
    frequency: high

  - id: "CL-228"
    title: "资本公积金"
    text: "公司以超过股票票面金额的发行价格发行股份所得的溢价款以及国务院财政部门规定列入资本公积金的其他收入，应当列为公司资本公积金。"
    keywords: [资本公积金, 溢价, 发行]
    category: "公司财务、会计"
    frequency: medium

  - id: "CL-232"
    title: "公积金用途"
    text: "公司的公积金用于弥补公司的亏损、扩大公司生产经营或者转为增加公司资本。资本公积金不得用于弥补公司的亏损。"
    keywords: [公积金, 亏损, 生产经营, 资本]
    category: "公司财务、会计"
    frequency: high

  - id: "CL-240"
    title: "公司合并"
    text: "公司合并可以采取吸收合并或者新设合并。一个公司吸收其他公司为吸收合并，被吸收的公司解散。两个以上公司合并设立一个新的公司为新设合并，合并各方解散。"
    keywords: [合并, 吸收合并, 新设合并, 解散]
    category: "公司合并、分立、增资、减资"
    frequency: high

  - id: "CL-241"
    title: "合并程序"
    text: "公司合并应当由合并各方签订合并协议，并编制资产负债表及财产清单。公司应当自作出合并决议之日起十日内通知债权人，并于三十日内在报纸上或者国家企业信用信息公示系统公告。"
    keywords: [合并, 合并协议, 资产负债表, 通知, 公告]
    category: "公司合并、分立、增资、减资"
    frequency: high

  - id: "CL-243"
    title: "合并债权债务"
    text: "合并后存续的公司或者新设的公司承继合并各方的债权、债务。"
    keywords: [合并, 债权, 债务, 承继]
    category: "公司合并、分立、增资、减资"
    frequency: high

  - id: "CL-246"
    title: "公司分立"
    text: "公司分立，其财产作相应的分割。公司分立应当由董事会提出方案，由股东会决议。公司分立应当编制资产负债表及财产清单。公司应当自作出分立决议之日起十日内通知债权人，并于三十日内在报纸上或者国家企业信用信息公示系统公告。"
    keywords: [分立, 财产分割, 资产负债表, 通知, 公告]
    category: "公司合并、分立、增资、减资"
    frequency: high

  - id: "CL-254"
    title: "减少注册资本"
    text: "公司需要减少注册资本时，必须编制资产负债表及财产清单。公司应当自作出减少注册资本决议之日起十日内通知债权人，并于三十日内在报纸上或者国家企业信用信息公示系统公告。债权人自接到通知书之日起三十日内，未接到通知书的自公告之日起四十五日内，有权要求公司清偿债务或者提供相应的担保。"
    keywords: [减少注册资本, 资产负债表, 通知, 公告, 债权人]
    category: "公司合并、分立、增资、减资"
    frequency: high

  - id: "CL-260"
    title: "增加注册资本"
    text: "有限责任公司增加注册资本时，股东认缴新增资本的出资，依照本法设立有限责任公司缴纳出资的有关规定执行。股份有限公司增加注册资本时，股东认购新股，依照本法设立股份有限公司缴纳股款的有关规定执行。"
    keywords: [增加注册资本, 认缴, 出资]
    category: "公司合并、分立、增资、减资"
    frequency: medium

  - id: "CL-277"
    title: "公司解散"
    text: "公司因下列原因解散：（一）公司章程规定的营业期限届满或者公司章程规定的其他解散事由出现；（二）股东会决议解散；（三）因公司合并或者分立需要解散；（四）依法被吊销营业执照、责令关闭或者被撤销；（五）人民法院依照本法第二百三十三条的规定予以解散。"
    keywords: [解散, 营业期限, 吊销, 撤销]
    category: "公司解散和清算"
    frequency: high

  - id: "CL-280"
    title: "清算组"
    text: "公司应当在解散事由出现之日起十五日内成立清算组，开始清算。"
    keywords: [清算组, 解散, 清算, 十五日内]
    category: "公司解散和清算"
    frequency: high

  - id: "CL-283"
    title: "清算职权"
    text: "清算组在清算期间行使下列职权：（一）清理公司财产，分别编制资产负债表和财产清单；（二）通知、公告债权人；（三）处理与清算有关的公司未了结的业务；（四）清缴所欠税款以及清算过程中产生的税款；（五）清理债权、债务；（六）处理公司清偿债务后的剩余财产；（七）代表公司参与民事诉讼活动。"
    keywords: [清算组, 职权, 资产负债表, 债权, 债务]
    category: "公司解散和清算"
    frequency: high

  - id: "CL-290"
    title: "清算分配"
    text: "公司财产在分别支付清算费用、职工工资、社会保险费用和法定补偿金，缴纳所欠税款，清偿公司债务后的剩余财产，有限责任公司按照股东的出资比例分配，股份有限公司按照股东持有的股份比例分配。"
    keywords: [清算, 分配, 工资, 税款, 债务, 剩余财产]
    category: "公司解散和清算"
    frequency: high

  - id: "CL-294"
    title: "破产清算"
    text: "清算组在清理公司财产、编制资产负债表和财产清单后，发现公司财产不足清偿债务的，应当依法向人民法院申请宣告破产。"
    keywords: [破产, 清算, 债务, 财产不足]
    category: "公司解散和清算"
    frequency: high
