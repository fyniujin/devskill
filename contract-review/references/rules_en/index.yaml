# 首批覆盖：FIDIC(15条) + CISG(20条) + 普通法高频条款(80条)

rule_categories:
  - id: fidic_risk
    name: FIDIC 合同风险
    description: 国际工程承包 FIDIC 合同条件相关风险
  - id: cisg_risk
    name: CISG 风险
