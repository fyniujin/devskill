name: ssrf
display_name: SSRF/内网访问
severity: high
description: 检测内网 IP 地址、localhost 访问等 SSRF 风险

patterns:
  - '127\.0\.0\.1'
  - 'localhost'
  - '0\.0\.0\.0'
  - '10\.\d{1,3}\.\d{1,3}\.\d{1,3}'
  - '172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}'
  - '192\.168\.\d{1,3}\.\d{1,3}'
  - '169\.254\.\d{1,3}\.\d{1,3}'
  - 'fc00:'
  - 'fe80:'
  - '\[::1\]'
  - '\[::ffff:127\.0\.0\.1\]'

suggestion: 避免硬编码内网 IP，改用域名或环境变量
source: static
