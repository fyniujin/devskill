  - 'ignore above all'
  - 'system prompt override'
  - 'ignore all previous'
  - 'you are now a'
  - 'jailbreak'
  - 'DAN mode'
  - 'do anything now'
  - 'pretend to be'
  - 'override safety'
  - 'disable safety'
  - 'forget everything'
  - 'roleplay as an'
  - 'start over'
  - 'reset instructions'

suggestion: 移除提示注入或越狱指令文本；如为文档示例，请添加 # nosec 注释
