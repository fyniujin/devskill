name: credential_leak
display_name: 凭证外泄
severity: critical
description: 检测硬编码 API Key、Token、Password、Bearer Token 等敏感信息泄露

patterns:
  - '(?i)(api[_-]?key|apikey)\s*[:=]\s*["\']?[a-z0-9]{20,}["\']?'
  - '(?i)(secret[_-]?key|secretkey)\s*[:=]\s*["\']?[a-z0-9]{20,}["\']?'
  - '(?i)(access[_-]?token|accesstoken)\s*[:=]\s*["\']?[a-z0-9]{20,}["\']?'
  - '(?i)(private[_-]?key|privatekey)\s*[:=]\s*["\']?[a-z0-9/+=]{40,}["\']?'
  - '(?i)(password|passwd|pwd)\s*[:=]\s*["\'][^"\']{8,}["\']'
  - '(?i)bearer\s+[a-z0-9\-._~+/]+=*'
  - '(?i)aws[_-]?(access[_-]?key[_-]?id|secret[_-]?access[_-]?key)\s*[:=]\s*["\']?[a-z0-9/+=]{20,}["\']?'
  - '(?i)gh[pousr]_[a-z0-9]{36,}'
  - '(?i)sk-[a-z0-9]{48}'
  - '(?i)AKID[a-z0-9]{32}'

suggestion: 立即轮换凭证！使用环境变量或密钥管理器存储敏感信息
source: static
