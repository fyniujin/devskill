# 扁平键值格式，PowerShell 5.1 原生可解析（无需第三方库）
# 监控采样器实际读取的是 output 目录下的副本：
#   ~/.workbuddy/output/winskill/thresholds.yaml
# 用户可直接编辑该副本，修改后下一采样周期自动生效。
# 本文件作为可编辑模板与权威来源留存于 skill 仓库。

cpu_warn: 80
cpu_alert: 90
mem_warn: 85
mem_alert: 95
disk_warn: 85
disk_alert: 95
svc_check: Spooler,Winmgmt,Dnscache,W32Time
evt_window_min: 15
evt_max: 50
dedup_min: 30
